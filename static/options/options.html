<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Summarizer — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="container">
    <h1>YouTube Summarizer Settings</h1>

    <section>
      <h2>API Configuration</h2>
      <div class="field">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="gemini">Gemini</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="deepseek">DeepSeek</option>
          <option value="xai">xAI (Grok)</option>
        </select>
      </div>

      <div class="field" id="model-field">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>

      <div class="field">
        <label for="apiKey">API Key</label>
        <div class="key-row">
          <input type="password" id="apiKey" placeholder="Paste your API key here" />
          <button id="toggleKey" type="button" class="btn-small">Show</button>
          <button id="validateKey" type="button" class="btn-small btn-primary">Test</button>
        </div>
        <span id="validationStatus" class="hint"></span>
      </div>

      <div class="field">
        <label></label>
        <button id="saveBtn" class="btn-primary">Save Settings</button>
        <span id="saveStatus"></span>
      </div>
    </section>

    <section>
      <h2>Analytics</h2>
      <label class="checkbox-row">
        <input type="checkbox" id="gaEnabled" checked />
        Anonymous usage analytics
      </label>
      <span class="hint">No video URLs, transcripts, or API keys are ever sent.</span>
    </section>

    <section>
      <h2>Theme</h2>
      <div class="field">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </section>

    <section>
      <h2>Privacy</h2>
      <p>
        <a href="#" id="privacyLink">Privacy Policy</a>
      </p>
    </section>

    <section>
      <h2>Feedback</h2>
      <p><a href="mailto:youtubesummarizer74@gmail.com">youtubesummarizer74@gmail.com</a></p>
    </section>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
